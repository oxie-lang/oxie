id = "oxie"
name = "Oxie"
version = "0.1.0"
schema_version = 1
description = "Support for the Oxie programming language: syntax highlighting, outline, run and test buttons, and the Oxie language server (diagnostics, completion, hover, go to definition, rename, formatting)."
authors = ["Berkay Akin"]
repository = "https://github.com/oxie-lang/oxie"
snippets = ["./snippets/oxie.json"]

# Zed builds the grammar from the repository at this commit: the last one that changed
# editors/tree-sitter-oxie (set by ../build-zed-extension.sh).
[grammars.oxie]
repository = "https://github.com/oxie-lang/oxie"
rev = "0e1b96b309df3e8db82ccc55b257b48ba65493fa"
path = "editors/tree-sitter-oxie"

[language_servers.oxie]
languages = ["Oxie"]
